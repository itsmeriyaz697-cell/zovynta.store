<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zovyenta Admin | Orders</title><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="admin.css"></head>
<body><main class="admin-shell"><header><div><p class="eyebrow">ZOVYENTA STORE</p><h1>Order dashboard</h1><p class="muted">Private order management</p></div><a href="/">View storefront</a></header>
<section id="loginCard" class="card"><h2>Admin sign in</h2><p class="muted">Enter the password configured in Vercel environment variables.</p><form id="loginForm"><label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button><p id="loginStatus" class="status"></p></form></section>
<section id="ordersCard" class="card hidden"><div class="toolbar"><div><h2>Orders</h2><p id="summary" class="muted"></p></div><div><button id="refresh" class="secondary">Refresh</button><button id="logout" class="secondary">Log out</button></div></div><div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Phone</th><th>Product</th><th>Price</th><th>Placed</th></tr></thead><tbody id="ordersBody"></tbody></table></div><p id="ordersStatus" class="status"></p></section></main><script src="admin.js"></script></body></html>
